# Le site vitrine (site/, speedster-js) : rendu au build en HTML statique, publié
# sur GitHub Pages (Settings → Pages → Source : GitHub Actions).
# Le numéro de la dernière version et la taille des paquets sont lus par le
# navigateur sur l'API de GitHub : une nouvelle version n'a pas besoin de
# republier le site.

name: pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # @ajustor/speedster vient de npm (site/.npmrc) : aucun jeton.
      - name: Dépendances
        run: bun install --frozen-lockfile

      - name: Types et accessibilité
        run: bun run check

      # Les scripts de build compris (build.ts importe le plugin).
      - name: Types du projet
        run: bun run typecheck

      - name: Construire
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
