# CI du dépôt public : clone le dépôt privé Ajustor/dq9Recomp avec une deploy key en lecture seule,
# compile le jeu et son lanceur pour Windows, Linux et Android, et publie une version à chaque
# étiquette `v*`, et à chaque merge sur master du dépôt privé (sa CI envoie un
# `repository_dispatch` « master » avec le commit, si elle a le secret RELEASES_TOKEN).
# Chaque version porte un `version.json` (nom, numéro de build, commit) : le lanceur du jeu le lit
# pour proposer la mise à jour.
# Les journaux et les versions d'un dépôt public sont visibles de tous : rien ici n'affiche le code
# du dépôt privé, et aucune donnée du jeu n'est incluse (chaque joueur importe sa propre ROM).
# Les tests restent dans la CI du dépôt privé, pour ne pas exposer leurs sorties.

name: release

on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, étiquette ou commit du dépôt privé à compiler"
        default: master
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: Ajustor/dq9Recomp

jobs:
  # Fixe le commit du dépôt privé une seule fois, pour que les trois systèmes compilent le même :
  # le commit envoyé par la CI privée, sinon l'étiquette du même nom si elle existe dans le dépôt
  # privé, sinon master (ou l'entrée manuelle). Puis son numéro de build (le nombre de commits,
  # comme le versionCode de l'APK), le nom de la version et l'étiquette à publier.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      build: ${{ steps.version.outputs.build }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Révision du dépôt privé
        id: ref
        env:
          SSH_KEY: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          WANTED: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref_name }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          echo "$SSH_KEY" | ssh-add - 2> /dev/null
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts 2> /dev/null
          url="git@github.com:$PRIVATE_REPO.git"
          refs=$(git ls-remote "$url" "refs/tags/$WANTED" "refs/tags/$WANTED^{}" "refs/heads/$WANTED")
          # Une étiquette annotée donne son objet puis, avec ^{}, le commit qu'elle désigne
          sha=$( (grep -F "refs/tags/$WANTED^{}" <<< "$refs"; grep -F -e "refs/tags/$WANTED" -e "refs/heads/$WANTED" <<< "$refs") | head -n1 | cut -f1)
          if [ -z "$sha" ] && [[ "$WANTED" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$WANTED
          fi
          if [ -z "$sha" ]; then
            echo "« $WANTED » est introuvable dans le dépôt privé, compilation de master"
            sha=$(git ls-remote "$url" refs/heads/master | cut -f1)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit du dépôt privé : $sha"

      # Un clone sans le contenu des fichiers (--filter=blob:none) : l'historique suffit à compter.
      - name: Numéro de version
        id: version
        env:
          SSH_KEY: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          SHA: ${{ steps.ref.outputs.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          echo "$SSH_KEY" | ssh-add - 2> /dev/null
          git clone -q --bare --filter=blob:none "git@github.com:$PRIVATE_REPO.git" private.git
          build=$(git -C private.git rev-list --count "$SHA")
          commit=$(git -C private.git rev-parse --short "$SHA")
          # La base x.y : la version du workspace (Cargo.toml du dépôt privé, [workspace.package]).
          base=$(git -C private.git show "$SHA:Cargo.toml" | sed -nE 's/^version = "([0-9]+)\.([0-9]+)\..*/\1.\2/p' | head -n1)
          base=${base:-0.4}
          # Une étiquette v0.5.0 garde son nom ; un merge sur master devient la version <x.y>.<build>.
          if [ "$EVENT" = push ] && [[ "$REF" =~ ^v[0-9] ]]; then
            version=${REF#v}; tag=$REF
          elif [ "$EVENT" = repository_dispatch ]; then
            version=$base.$build; tag=v$version
          else
            version=$base.$build; tag=
          fi
          { echo "build=$build"; echo "commit=$commit"; echo "version=$version"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "Version $version (build $build, commit $commit)"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: .exe
          - os: ubuntu-latest
            name: linux-x64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bibliothèques système (son, manettes, fenêtres)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      # Le numéro de version du lanceur (crates/dq9-launcher/build.rs) : celui de `resolve`, le clone
      # étant superficiel.
      - name: Compilation
        env:
          DQ9_BUILD: ${{ needs.resolve.outputs.build }}
          DQ9_COMMIT: ${{ needs.resolve.outputs.commit }}
          DQ9_VERSION: ${{ needs.resolve.outputs.version }}
        run: cargo build --release -p dq9-runtime -p dq9-extract

      - name: Paquet
        shell: bash
        run: |
          out=dq9recomp-${{ matrix.name }}
          mkdir -p "$out/config"
          for bin in dq9-runtime dq9-extract; do
            cp "target/release/$bin${{ matrix.exe }}" "$out/"
          done
          cp config/rom.json config/progress.json "$out/config/"
          cp README.md "$out/"
          echo "Lancez dq9-runtime : importez votre ROM européenne de Dragon Quest IX depuis le lanceur, puis jouez." > "$out/LISEZMOI.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dq9recomp-${{ matrix.name }}
          path: |
            dq9recomp-${{ matrix.name }}.zip
            dq9recomp-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # L'APK Android (téléphones 64 bits) : la bibliothèque du moteur par cargo-ndk (crate
  # dq9-android), puis le projet Gradle android/ du dépôt privé. Signé avec le keystore des
  # secrets : sans eux, aucune version n'est publiée (une compilation manuelle prend la clé de
  # débogage du dépôt, que Play Protect juge dangereuse).
  android:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false

      # Une révision d'avant la version Android (sans android/ ni crates/dq9-android) : pas
      # d'APK, les paquets Windows et Linux sont publiés quand même.
      - name: Projet Android présent ?
        id: present
        run: |
          if [ -d android ] && [ -d crates/dq9-android ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cette révision du dépôt privé n'a pas de version Android : pas d'APK."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.present.outputs.ok
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: steps.present.outputs.ok
        with:
          key: android

      - uses: actions/setup-java@v4
        if: steps.present.outputs.ok
        with:
          distribution: temurin
          java-version: 17

      # Le SDK est déjà sur ubuntu-latest (ANDROID_HOME) : son sdkmanager le plus récent ajoute
      # le NDK, la plateforme et les outils de construction.
      - name: NDK et cargo-ndk
        if: steps.present.outputs.ok
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Bibliothèque native (libdq9.so)
        if: steps.present.outputs.ok
        env:
          DQ9_BUILD: ${{ needs.resolve.outputs.build }}
          DQ9_COMMIT: ${{ needs.resolve.outputs.commit }}
          DQ9_VERSION: ${{ needs.resolve.outputs.version }}
        run: cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build --release -p dq9-android

      - name: APK
        if: steps.present.outputs.ok
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISHING: ${{ needs.resolve.outputs.tag }}
        run: |
          # Une version publiée doit être signée de la clé de release : avec la clé de débogage du
          # dépôt, Play Protect bloque l'installation, et passer ensuite à la vraie clé oblige à
          # désinstaller le jeu. Une compilation manuelle (sans version) reste permise.
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ -n "$PUBLISHING" ]; then
              echo "::error::Secrets manquants pour signer l'APK de la version $PUBLISHING :$missing (voir README, étape 6). Rien n'est publié."
              exit 1
            fi
            echo "::warning::Secrets manquants :$missing. APK signé avec la clé de débogage (compilation manuelle, non publiée)."
          fi
          # versionCode : le nombre de commits du dépôt privé (le même que dans sa propre CI).
          ./gradlew assembleRelease --no-daemon -Pdq9.skipCargo=true -Pdq9.abis=arm64-v8a \
            -Pdq9.versionCode=${{ needs.resolve.outputs.build }} -Pdq9.versionName=${{ needs.resolve.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk ../dq9recomp-android-arm64.apk
          # Garde-fou : une version publiée n'est jamais signée de la clé de débogage du dépôt.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          signer=$("$apksigner" verify --print-certs ../dq9recomp-android-arm64.apk | grep -m1 "certificate DN")
          echo "$signer"
          if [ -n "$PUBLISHING" ] && grep -q "dq9Recomp Debug" <<< "$signer"; then
            echo "::error::L'APK est signé de la clé de débogage : rien n'est publié."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.present.outputs.ok
        with:
          name: dq9recomp-android-arm64
          path: dq9recomp-android-arm64.apk
          if-no-files-found: error

  # Une seule version par étiquette (ou par merge sur master), une fois les trois paquets prêts.
  release:
    needs: [resolve, build, android]
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Ce que lit le lanceur pour proposer la mise à jour (crates/dq9-launcher/src/update.rs).
      - name: version.json
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          printf '{"version": "%s", "build": %s, "commit": "%s"}\n' "$VERSION" "$BUILD" "$COMMIT" > dist/version.json
          cat dist/version.json

      # Pour un merge sur master, l'étiquette est créée ici, sur le dernier commit du dépôt public.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: dq9Recomp ${{ needs.resolve.outputs.version }}
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Paquets Windows et Linux de dq9Recomp, et l'APK Android (téléphones 64 bits, Android 8 ou plus).
            Lancez dq9-runtime (ou l'application Dragon Quest IX sur Android), importez votre ROM européenne de Dragon Quest IX (YDQP) depuis le lanceur, puis jouez.
            Déjà installé ? Le lanceur propose cette version tout seul (Réglages → Mises à jour).
            Aucune donnée du jeu n'est incluse.
